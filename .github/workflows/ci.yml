name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "./contracts[dev]"
      - name: Lint
        run: ruff check .
      - name: Contract tests (every fixture must validate)
        run: cd contracts && python -m pytest -q

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d platform"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PSQL: psql postgresql://postgres:postgres@localhost:5432/platform
    steps:
      - uses: actions/checkout@v4
      - name: Migrate
        run: ./scripts/migrate.sh
      - name: Database safety tests (tenant isolation, append-only audit log)
        run: $PSQL -q -v ON_ERROR_STOP=1 -f infra/db/tests/rls_test.sql
